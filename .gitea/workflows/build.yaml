name: Build container image

# Builds the fork's image into the Gitea package registry, e.g.
# gitea.house.nickistre.net/home/olla-queue:latest. Gitea ignores
# .github/workflows once this directory exists, so upstream's GitHub CI and
# release jobs (which publish to ghcr.io) never run here.
on:
  push:
    branches: ['feat/**']
  workflow_dispatch:

# Only one run per branch at a time; a newer push supersedes the build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Held at 1.24 like upstream (see the compatibility pins in CLAUDE.md).
  GO_VERSION: 1.24.x
  BUN_VERSION: "1.3.5"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so git describe can find a tag for the version string.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Fast unit pass so a broken commit never becomes :latest.
      - name: Test
        run: go test -short ./...

      # The Dockerfile does not compile anything: it COPYs a prebuilt static
      # binary and the container config (the same inputs make
      # docker-build-local stages). The binary must embed the dashboard, so
      # build-web runs first; without it the image serves a 503 dashboard.
      - name: Build dashboard
        run: make build-web

      - name: Build binary
        run: |
          # Prefer a tag-relative version; the fork's registry may not carry
          # upstream's tags, so fall back to branch + short sha.
          if VERSION=$(git describe --tags 2>/dev/null); then :; else
            VERSION="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
          fi
          PKG=github.com/thushan/olla/internal/version
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "\
            -X '$PKG.Version=$VERSION' \
            -X '$PKG.Runtime=Go v$(go env GOVERSION | sed 's/^go//')' \
            -X '$PKG.Commit=${GITHUB_SHA::7}' \
            -X '$PKG.Date=$(date +%Y-%m-%dT%H:%M:%S%z)' \
            -X '$PKG.Tool=gitea-actions' \
            -X '$PKG.User=${GITHUB_ACTOR}'" -o olla .
          ./olla -version

      - name: Stage container config
        run: |
          bash ./scripts/generate-container-config.sh
          mkdir -p build
          cp config/docker.yaml build/docker-config.yaml

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.registry }}
          username: ${{ vars.actions_user }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.registry }}/${{ gitea.repository }}
          # latest follows the repo's default branch (currently
          # feat/request-queue); sha- tags are for pinning a deployment.
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # amd64 only: the binary is cross-compiled for amd64 above, and the
          # Dockerfile's apk RUN would need QEMU for other platforms.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
